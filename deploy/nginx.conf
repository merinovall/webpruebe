worker_processes auto;
events { worker_connections 2048; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 sendfile on;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
 limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
 limit_req_status 429;
 upstream hotel { server web:8000; keepalive 32; }
 server {
  listen 80;
  client_max_body_size 6m;
  client_body_timeout 10s;
  error_page 429 = @rate_limited;
  location @rate_limited {
   default_type application/json;
   add_header Retry-After 3 always;
   return 429 '{"error":"Hay demasiadas solicitudes. Espera unos segundos."}';
  }
  location /static/ {
   alias /srv/static/;
   expires 1d;
   add_header X-Content-Type-Options nosniff;
  }
  location ~ ^/api/(login|register|password)$ {
   limit_req zone=auth burst=5 nodelay;
   proxy_pass http://hotel;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_connect_timeout 3s;
   proxy_read_timeout 30s;
   proxy_next_upstream off;
  }
  location /api/ {
   limit_req zone=api burst=30 nodelay;
   proxy_pass http://hotel;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_connect_timeout 3s;
   proxy_read_timeout 30s;
   proxy_next_upstream off;
  }
  location / { proxy_pass http://hotel;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_connect_timeout 3s;
   proxy_read_timeout 30s;
   proxy_next_upstream off; }
 }
}
