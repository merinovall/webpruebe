services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  init:
    build: .
    environment: &application
      DATABASE_URL: postgresql://hotel:${POSTGRES_PASSWORD}@db:5432/hotel
      SECRET_KEY: ${SECRET_KEY:?Configura SECRET_KEY en .env}
      HOTEL_HTTPS: ${HOTEL_HTTPS:-0}
      TRUST_PROXY: "1"
      HOTEL_CONFIG_FILE: /app/instance/hotel.json
      DB_POOL_SIZE: "8"
    command: ["python", "-c", "from app import init; init()"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: .
    environment: *application
    volumes:
      - appdata:/app/instance
      - hotelimages:/app/static/img
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/srv/static:ro
      - hotelimages:/srv/static/img:ro
    depends_on: [web]
    restart: unless-stopped
volumes:
  appdata:
  hotelimages:
  pgdata:
